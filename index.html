<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in | Checkly</title>
    <link rel="stylesheet" href="static/style.css">
    <link rel="manifest" href="static/manifest.json">
    <meta name="theme-color" content="#2F4A3B">
    <link rel="apple-touch-icon" href="static/icons/apple-touch-icon.png">
    <link rel="icon" href="static/icons/icon-512.png">
</head>
<body class="auth-body">
    <div class="auth-shell">
        <section class="auth-visual" aria-hidden="true">
            <div class="auth-visual-inner">
                <div class="auth-wordmark">Checkly</div>
                <p class="auth-tagline">Take roll in seconds.</p>

                <div class="roll-sheet">
                    <div class="roll-row">
                        <span class="roll-name-bar"></span>
                        <span class="roll-mark roll-present">&#10003;</span>
                    </div>
                    <div class="roll-row">
                        <span class="roll-name-bar"></span>
                        <span class="roll-mark roll-present">&#10003;</span>
                    </div>
                    <div class="roll-row">
                        <span class="roll-name-bar"></span>
                        <span class="roll-mark roll-late">&#9201;</span>
                    </div>
                    <div class="roll-row">
                        <span class="roll-name-bar"></span>
                        <span class="roll-mark roll-present">&#10003;</span>
                    </div>
                    <div class="roll-row">
                        <span class="roll-name-bar"></span>
                        <span class="roll-mark roll-absent">&#10007;</span>
                    </div>
                </div>
            </div>
        </section>

        <section class="auth-form-panel">
            <form class="auth-form" id="login-form" novalidate>
                <h1 class="auth-heading">Welcome back</h1>
                <p class="auth-subheading">Log in to mark or check today's attendance.</p>

                <label class="custom-label" for="email">Email</label>
                <input class="custom-inp" type="text" name="email" id="email" autocomplete="email" required>

                <label class="custom-label" for="password">Password</label>
                <div class="pw-field">
                    <input class="custom-inp" type="password" name="password" id="password" autocomplete="current-password" required>
                    <button type="button" class="pw-toggle" data-pw-toggle="password" aria-label="Show password" aria-pressed="false" title="Show password">
                        <svg class="pw-eye" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
                        <svg class="pw-eye-off" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a19.8 19.8 0 0 1 5.06-5.94"/><path d="M9.9 4.24A10.9 10.9 0 0 1 12 5c7 0 11 7 11 7a19.9 19.9 0 0 1-3.17 4.19"/><path d="M14.12 14.12A3 3 0 1 1 9.88 9.88"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                    </button>
                </div>

                <label class="remember-me-label">
                    <input type="checkbox" id="remember-me">
                    Remember me
                </label>

                <button class="auth-submit" type="submit">Log in</button>

                <p class="auth-switch">New here? <a href="register.html">Create an account</a></p>
            </form>
        </section>
    </div>

    <script src="static/app.js"></script>
    <script src="static/login.js"></script>
</body>
</html>
