<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    <div class="login-container">
        <form class="main-login-container" id="login-form">
            <div class="title">Checkly</div>
            <div class="title-description">Student attendance system.</div>

            <label class="custom-label email-label" for="email">Email</label>
            <input class="custom-inp" type="text" name="email" id="email" required>

            <label class="custom-label password-label" for="password">Password</label>
            <input class="custom-inp" type="password" name="password" id="password" required>

            <button class="custom-button login-button" type="submit">Login</button>
            <a class="custom-button create-link" href="register.html">Create Account</a>

        </form>
    </div>

    <script src="static/app.js"></script>
    <script src="static/login.js"></script>
</body>
</html>
